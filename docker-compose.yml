services:
  freemodel-router:
    build: .
    container_name: freemodel-router
    restart: unless-stopped
    ports:
      - "7352:7352"
    volumes:
      - ./freemodel-config.json:/root/.freemodel-router.json
    environment:
      - NVIDIA_API_KEY=nvapi-xxx
      - OPENROUTER_API_KEY=sk-or-xxx
